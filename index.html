<meta name="apple-mobile-web-app-title" content="FP3級">

<title>FP3級 学習</title>
<style>
:root{
  --ink:#16221f; --paper:#f5f2ea; --card:#fffdf8;
  --green:#1a3a32; --green-lt:#2d5546; --sand:#e8e2d4;
  --gold:#b8924a; --red:#a8453a; --ok:#3f7a5f;
  --muted:#6f6a5d; --line:#ddd6c6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:var(--paper); color:var(--ink);
  line-height:1.7; overscroll-behavior:none;
}
.wrap{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:var(--paper);position:relative}
/* header */
header{background:var(--green);color:var(--paper);padding:14px 18px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
header .back{font-size:22px;cursor:pointer;width:28px;line-height:1;opacity:.9}
header .title{font-size:16px;font-weight:600;letter-spacing:.02em;flex:1}
header .sub{font-size:12px;opacity:.7;font-weight:400}
main{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px}
/* home brand */
.brand{padding:30px 4px 8px}
.brand .eyebrow{font-size:11px;letter-spacing:.28em;color:var(--gold);font-weight:700;text-transform:uppercase}
.brand h1{font-size:27px;font-weight:800;letter-spacing:.01em;margin-top:6px;line-height:1.25}
.brand p{font-size:13px;color:var(--muted);margin-top:8px}
/* progress ring summary */
.statbar{display:flex;gap:10px;margin-top:6px}
.statbox{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px}
.statbox .n{font-size:23px;font-weight:800;color:var(--green)}
.statbox .l{font-size:11px;color:var(--muted);margin-top:2px}
/* section label */
.seclabel{font-size:11px;letter-spacing:.2em;color:var(--muted);font-weight:700;
  text-transform:uppercase;margin:8px 2px 0}
/* category cards */
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;
  transition:transform .08s ease, box-shadow .15s ease}
.cat:active{transform:scale(.985)}
.cat .idx{width:34px;height:34px;border-radius:10px;background:var(--green);
  color:var(--paper);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;flex-shrink:0}
.cat .body{flex:1;min-width:0}
.cat .body .nm{font-weight:700;font-size:15px}
.cat .body .meta{font-size:12px;color:var(--muted);margin-top:2px}
.cat .pct{font-size:13px;font-weight:700;color:var(--gold)}
.bar{height:5px;background:var(--sand);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .4s}
/* big buttons */
.btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--green);color:var(--paper)}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--green);color:var(--green)}
/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;
  color:var(--muted);font-weight:600}
.qcat{color:var(--gold);font-weight:700}
.progline{height:5px;background:var(--sand);border-radius:3px;overflow:hidden}
.progline i{display:block;height:100%;background:var(--green);transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 20px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.qtype{display:inline-block;font-size:10px;letter-spacing:.15em;font-weight:700;
  padding:3px 9px;border-radius:20px;background:var(--sand);color:var(--green-lt);
  text-transform:uppercase;margin-bottom:12px}
.qtext{font-size:18px;font-weight:600;line-height:1.6}

    Object.assign({categoryScores, totalAnswered, totalCorrect, mockScore}, p);

 "×"], "answer": 0, "exp": "重大な場合は解除されます"}, {"id": "R024", "category": "リスク管理", "type": "ox", "q": "契約転換制度は既契約を活用する制度である", "choices": ["○", "×"], "answer": 0, "exp": "積立部分等を利用します"}, {"id": "R025", "category": "リスク管理", "type": "ox", "q": "払済保険は保険料の支払いを停止する制度である", "choices": ["○", "×"], "answer": 0, "exp": "保障額は減少します"}, {"id": "R026", "category": "リスク管理", "type": "ox", "q": "延長保険では保障期間が短くなる場合がある", "choices": ["○", "×"], "answer": 0, "exp": "保険金額は維持し期間が短縮されます"}, {"id": "R027", "category": "リスク管理", "type": "ox", "q": "解約返戻金は必ず払込保険料総額を上回る", "choices": ["○", "×"], "answer": 1, "exp": "下回ることも多いです"}, {"id": "R028", "category": "リスク管理", "type": "ox", "q": "終身保険には解約返戻金がある場合が多い", "choices": ["○", "×"], "answer": 0, "exp": "貯蓄性があります"}, {"id": "R029", "category": "リスク管理", "type": "ox", "q": "医療保険の入院給付金は入院日数に応じて支払われることがある", "choices": ["○", "×"], "answer": 0, "exp": "契約内容によります"}, {"id": "R030", "category": "リスク管理", "type": "ox", "q": "先進医療特約は先進医療技術に備える特約である", "choices": ["○", "×"], "answer": 0, "exp": "技術料等を補償します"}, {"id": "R031", "category": "リスク管理", "type": "ox", "q": "保険法は保険契約に関する法律である", "choices": ["○", "×"], "answer": 0, "exp": "保険契約の基本ルールを定めています"}, {"id": "R032", "category": "リスク管理", "type": "ox", "q": "損害保険には超過保険の概念がある", "choices": ["○", "×"], "answer": 0, "exp": "保険価額を超える契約です"}, {"id": "R033", "category": "リスク管理", "type": "ox", "q": "火災保険は住宅以外にも加入できる", "choices": ["○", "×"], "answer": 0, "exp": "店舗や事務所も対象です"}, {"id": "R034", "category": "リスク管理", "type": "ox", "q": "地震保険金額は火災保険金額の範囲内で設定する", "choices": ["○", "×"], "answer": 0, "exp": "一定割合で設定します"}, {"id": "R035", "category": "リスク管理", "type": "ox", "q": "個人賠償責任保険は日常生活の賠償事故を補償する", "choices": ["○", "×"], "answer": 0, "exp": "自転車事故等も対象になります"}, {"id": "R036", "category": "リスク管理", "type": "ox", "q": "所得補償保険は働けなくなった際の所得減少に備える", "choices": ["○", "×"], "answer": 0, "exp": "就業不能時の補償です"}, {"id": "R037", "category": "リスク管理", "type": "ox", "q": "介護保険は公的介護保険とは無関係である", "choices": ["○", "×"], "answer": 1, "exp": "連動する商品もあります"}, {"id": "R038", "category": "リスク管理", "type": "ox", "q": "生命保険料控除は住民税でも適用される", "choices": ["○", "×"], "answer": 0, "exp": "住民税にも控除があります"}, {"id": "R039", "category": "リスク管理", "type": "ox", "q": "保険募集人は保険契約の媒介を行う", "choices": ["○", "×"], "answer": 0, "exp": "契約手続きをサポートします"}, {"id": "R040", "category": "リスク管理", "type": "ox", "q": "保険契約は口頭のみで成立することが多い", "choices": ["○", "×"], "answer": 1, "exp": "通常は申込書等によります"}, {"id": "R041", "category": "リスク管理", "type": "ox", "q": "被保険利益は損害保険で重要な概念である", "choices": ["○", "×"], "answer": 0, "exp": "保険契約成立の要件です"}, {"id": "R042", "category": "リスク管理", "type": "ox", "q": "生命保険では被保険利益は不要である", "choices": ["○", "×"], "answer": 1, "exp": "一定の利害関係が必要です"}, {"id": "R043", "category": "リスク管理", "type": "ox", "q": "再調達価額とは同等の物を再取得する価格である", "choices": ["○", "×"], "answer": 0, "exp": "火災保険等で使われます"}, {"id": "R044", "category": "リスク管理", "type": "ox", "q": "時価額は再調達価額から消耗分を差し引いた価額である", "choices": ["○", "×"], "answer": 0, "exp": "減価償却後の価額です"}, {"id": "R045", "category": "リスク管理", "type": "ox", "q": "保険事故発生後は速やかに通知する必要がある", "choices": ["○", "×"], "answer": 0, "exp": "契約上の義務です"}, {"id": "R046", "category": "リスク管理", "type": "ox", "q": "契約者貸付制度は解約返戻金の範囲で利用できる", "choices": ["○", "×"], "answer": 0, "exp": "終身保険等で利用可能です"}, {"id": "R047", "category": "リスク管理", "type": "ox", "q": "自賠責保険は物損事故を補償する", "choices": ["○", "×"], "answer": 1, "exp": "人身事故のみ対象です"}, {"id": "R048", "category": "リスク管理", "type": "ox", "q": "傷害保険は国内旅行中の事故にも備えられる", "choices": ["○", "×"], "answer": 0, "exp": "契約内容によります"}, {"id": "R049", "category": "リスク管理", "type": "ox", "q": "保険はリスク移転の手段の一つである", "choices": ["○", "×"], "answer": 0, "exp": "FPの基本概念です"}, {"id": "R050", "category": "リスク管理", "type": "ox", "q": "生命保険の保険料は年齢等で変わることがある", "choices": ["○", "×"], "answer": 0, "exp": "年齢や性別などで異なります"}, {"id": "F001", "category": "金融資産運用", "type": "mc", "q": "日本銀行が発表する「企業短期経済観測調査（日銀短観）」は、原則として年何回発表されるか。", "choices": ["年2回", "年4回", "年12回"], "answer": 1, "exp": "日銀短観は原則として年4回（3月、6月、9月、12月）発表される。"}, {"id": "F002", "category": "金融資産運用", "type": "mc", "q": "景気動向指数のうち、数ヵ月先の景気の動きを示すものはどれか。", "choices": ["先行系列", "一致系列", "遅行系列"], "answer": 0, "exp": "先行系列は景気の動きに先行して動く指標。新規求人数などが該当する。"}, {"id": "F003", "category": "金融資産運用", "type": "mc", "q": "景気動向指数のうち、現在の景気の動きを示すものはどれか。", "choices": ["先行系列", "一致系列", "遅行系列"], "answer": 1, "exp": "一致系列は景気の現状を把握するための指標。有効求人倍率などが該当する。"}, {"id": "F004", "category": "金融資産運用", "type": "mc", "q": "国内総生産（GDP）の統計を作成し、原則として四半期ごとに公表している機関はどこか。", "choices": ["日本銀行", "財務省", "内閣府"], "answer": 2, "exp": "GDPは内閣府が作成・公表している。"}, {"id": "F005", "category": "金融資産運用", "type": "mc", "q": "マネーストック統計は、金融機関から経済全体へどの程度の通貨が供給されているかを示す指標だが、公表している機関はどこか。", "choices": ["日本銀行", "財務省", "内閣府"], "answer": 0, "exp": "マネーストック統計は日本銀行が作成・公表している。"}, {"id": "F006", "category": "金融資産運用", "type": "mc", "q": "一般に、景気が良くなり資金需要が高まると、金利はどうなる傾向があるか。", "choices": ["上昇する", "低下する", "変わらない"], "answer": 0, "exp": "景気拡大期には企業の資金需要が増加するため、金利は上昇する傾向がある。"}, {"id": "F007", "category": "金融資産運用", "type": "mc", "q": "一般に、物価が継続的に上昇するインフレーションが起こると、金利はどうなる傾向があるか。", "choices": ["上昇する", "低下する", "変わらない"], "answer": 0, "exp": "インフレ時にはお金の価値が下がるため、それを補うために金利は上昇する傾向がある。"}, {"id": "F008", "category": "金融資産運用", "type": "mc", "q": "日本銀行が行う公開市場操作（オペレーション）のうち、市場から資金を吸収し金利を上昇させる効果があるのはどれか。", "choices": ["買いオペレーション", "売りオペレーション", "据え置き"], "answer": 1, "exp": "売りオペは日銀が保有する有価証券を売却し、市場の資金を吸収するため金利上昇要因となる。"}, {"id": "F009", "category": "金融資産運用", "type": "mc", "q": "預金保険制度により全額保護される「決済用預金」の3要件に含まれないものはどれか。", "choices": ["無利息", "要求払い", "法人のみ利用可能"], "answer": 2, "exp": "決済用預金の3要件は「無利息」「要求払い」「決済サービスを提供できること」。法人個人問わず利用可能。"}, {"id": "F010", "category": "金融資産運用", "type": "mc", "q": "預金保険制度において、一般預金等（定期預金など）は1金融機関につき預金者1人当たり元本いくらまで保護されるか。", "choices": ["1,000万円とその利息", "1,300万円とその利息", "全額"], "answer": 0, "exp": "一般預金等は、元本1,000万円までとその利息等が保護の対象となる。"}, {"id": "F011", "category": "金融資産運用", "type": "mc", "q": "預金保険制度の保護の対象外となる金融商品はどれか。", "choices": ["当座預金", "外貨預金", "普通預金"], "answer": 1, "exp": "外貨預金、譲渡性預金などは預金保険制度の対象外である。"}, {"id": "F012", "category": "金融資産運用", "type": "mc", "q": "証券会社が破綻した場合、投資者保護基金によって一般顧客1人当たりいくらまで補償されるか。", "choices": ["1,000万円", "1,300万円", "2,000万円"], "answer": 0, "exp": "投資者保護基金による補償上限は、顧客1人当たり1,000万円である。"}, {"id": "F013", "category": "金融資産運用", "type": "mc", "q": "金融商品販売法において、金融商品販売業者が顧客に説明する義務を負っている事項はどれか。", "choices": ["確実な利益の保証", "元本割れリスク等の重要事項", "他社商品の欠点"], "answer": 1, "exp": "金融商品販売法では、元本割れ等のリスク（重要事項）の事前説明が義務付けられている。"}, {"id": "F014", "category": "金融資産運用", "type": "mc", "q": "ゆうちょ銀行の預入限度額について、通常貯金と定期性貯金のそれぞれの限度額の合計は現在いくらか。", "choices": ["1,000万円", "1,300万円", "2,600万円"], "answer": 2, "exp": "現在は通常貯金1,300万円、定期性貯金1,300万円の合計2,600万円が限度額となっている。"}, {"id": "F015", "category": "金融資産運用", "type": "mc", "q": "個人向け国債の購入単位（最低額面金額）はいくらか。", "choices": ["1万円", "5万円", "10万円"], "answer": 0, "exp": "個人向け国債は1万円から購入可能である。"}, {"id": "F016", "category": "金融資産運用", "type": "mc", "q": "個人向け国債のうち、金利が半年ごとに見直されるタイプはどれか。", "choices": ["固定3年", "固定5年", "変動10年"], "answer": 2, "exp": "変動10年は実勢金利に応じて半年ごとに適用利率が見直される。"}, {"id": "F017", "category": "金融資産運用", "type": "mc", "q": "個人向け国債に設定されている下限金利は年何％か。", "choices": ["0.01%", "0.05%", "0.10%"], "answer": 1, "exp": "すべての個人向け国債には年0.05%の下限金利が保証されている。"}, {"id": "F018", "category": "金融資産運用", "type": "mc", "q": "個人向け国債は、原則として発行から何年経過すれば中途換金が可能になるか。", "choices": ["1年", "3年", "5年"], "answer": 0, "exp": "個人向け国債は第2期利払日（発行から1年）経過後であればいつでも中途換金可能。"}, {"id": "F019", "category": "金融資産運用", "type": "mc", "q": "債券の信用格付において、一般に「投資適格」とされるのはどの格付以上か。", "choices": ["A以上", "BBB以上", "BB以上"], "answer": 1, "exp": "BBB（トリプルB）格以上が投資適格債券、BB格以下が投機的格付債券と呼ばれる。"}, {"id": "F020", "category": "金融資産運用", "type": "mc", "q": "一般に、市中金利が上昇したとき、既発債券の価格はどうなるか。", "choices": ["上昇する", "下落する", "変わらない"], "answer": 1, "exp": "金利が上昇すると、相対的に魅力が低下する既発債券の価格は下落する。"}, {"id": "F021", "category": "金融資産運用", "type": "mc", "q": "表面利率2%、発行価格100円、償還期間5年の新発債券を、発行時に購入し満期まで保有した場合の応募者利回りはいくらか（単利、税引前）。", "choices": ["1.0%", "2.0%", "3.0%"], "answer": 1, "exp": "発行価格が100円（額面と同額）の場合、応募者利回りは表面利率と同じ2.0%となる。"}, {"id": "F022", "category": "金融資産運用", "type": "mc", "q": "表面利率2%、購入価格98円、額面100円、残存期間2年の債券を満期まで保有した場合の最終利回りの計算式として正しいものはどれか。", "choices": ["(2 + (100 - 98) / 2) / 98 * 100", "(2 + (98 - 100) / 2) / 100 * 100", "(2 + (100 - 98) / 2) / 100 * 100"], "answer": 0, "exp": "最終利回り＝{表面利率＋(額面－購入価格)÷残存期間}÷購入価格×100。"}, {"id": "F023", "category": "金融資産運用", "type": "mc", "q": "国内の証券取引所に上場している内国株式の通常の売買単位は何株か。", "choices": ["1株", "100株", "1,000株"], "answer": 1, "exp": "現在、全国の証券取引所に上場する内国株式の売買単位は100株に統一されている。"}, {"id": "F024", "category": "金融資産運用", "type": "mc", "q": "株式の普通取引における受渡日は、約定日を含めて何営業日目か。", "choices": ["2営業日目", "3営業日目", "4営業日目"], "answer": 1, "exp": "株式の受渡日は、約定日から起算して（約定日を含めて）3営業日目（T+2）である。"}, {"id": "F025", "category": "金融資産運用", "type": "mc", "q": "株式の注文方法において、価格を指定せずに注文する「成行注文」と、価格を指定する「指値注文」が同時に出された場合、どちらが優先されるか。", "choices": ["成行注文", "指値注文", "注文数量が多い方"], "answer": 0, "exp": "価格の原則として、成行注文は指値注文に優先して売買が成立する。"}, {"id": "F026", "category": "金融資産運用", "type": "mc", "q": "日経平均株価（日経225）の算出対象となる銘柄数はいくつで、どの市場の銘柄から選定されているか。", "choices": ["東証スタンダードの225銘柄", "東証プライムの225銘柄", "東証グロースの225銘柄"], "answer": 1, "exp": "日経平均株価は、東証プライム市場上場銘柄のうち代表的な225銘柄で構成されている。"}, {"id": "F027", "category": "金融資産運用", "type": "mc", "q": "東証株価指数（TOPIX）は、どのような基準で算出される指標か。", "choices": ["構成銘柄の株価の単純平均", "構成銘柄の株価の時価総額加重平均", "構成銘柄の配当利回りの平均"], "answer": 1, "exp": "TOPIXは基準日の時価総額を100として、現在の時価総額がどの程度かを指数化したもの。"}, {"id": "F028", "category": "金融資産運用", "type": "mc", "q": "株価収益率（PER）を求める計算式はどれか。", "choices": ["株価 ÷ 1株当たり純資産", "株価 ÷ 1株当たり純利益", "1株当たり配当金 ÷ 株価"], "answer": 1, "exp": "PER（倍）＝株価÷1株当たり純利益（EPS）。割安性を測る指標。"}, {"id": "F029", "category": "金融資産運用", "type": "mc", "q": "株価純資産倍率（PBR）を求める計算式はどれか。", "choices": ["株価 ÷ 1株当たり純資産", "株価 ÷ 1株当たり純利益", "当期純利益 ÷ 自己資本"], "answer": 0, "exp": "PBR（倍）＝株価÷1株当たり純資産（BPS）。1倍を下回ると割安とされる。"}, {"id": "F030", "category": "金融資産運用", "type": "mc", "q": "自己資本利益率（ROE）を求める計算式はどれか。", "choices": ["株価 ÷ 1株当たり純利益", "当期純利益 ÷ 自己資本 × 100", "配当金総額 ÷ 当期純利益 × 100"], "answer": 1, "exp": "ROE（％）＝当期純利益÷自己資本×100。企業の収益性を示す。"}, {"id": "F031", "category": "金融資産運用", "type": "mc", "q": "配当利回りを求める計算式はどれか。", "choices": ["1株当たり配当金 ÷ 株価 × 100", "配当金総額 ÷ 当期純利益 × 100", "株価 ÷ 1株当たり純利益"], "answer": 0, "exp": "配当利回り（％）＝1株当たり配当金÷株価×100。投資金額に対する配当金の割合。"}, {"id": "F032", "category": "金融資産運用", "type": "mc", "q": "配当性向を求める計算式はどれか。", "choices": ["1株当たり配当金 ÷ 株価 × 100", "配当金総額 ÷ 当期純利益 × 100", "当期純利益 ÷ 自己資本 × 100"], "answer": 1, "exp": "配当性向（％）＝配当金総額÷当期純利益×100。利益のうち配当に回した割合を示す。"}, {"id": "F033", "category": "金融資産運用", "type": "mc", "q": "投資信託の仕組みにおいて、実際に資金の運用指図を行う機関はどこか。", "choices": ["販売会社", "委託者（委託会社）", "受託者（受託会社）"], "answer": 1, "exp": "委託会社（運用会社）が投資信託財産の運用指図を行う。"}, {"id": "F034", "category": "金融資産運用", "type": "mc", "q": "投資信託の仕組みにおいて、投資信託財産を保管・管理する機関はどこか。", "choices": ["販売会社", "委託者（委託会社）", "受託者（信託銀行）"], "answer": 2, "exp": "受託会社（信託銀行等）が財産の保管および管理を行う。"}, {"id": "F035", "category": "金融資産運用", "type": "mc", "q": "投資信託の運用手法で、日経平均株価などのベンチマークに連動する運用成果を目指すものを何というか。", "choices": ["アクティブ運用", "パッシブ運用（インデックス運用）", "トップダウン運用"], "answer": 1, "exp": "ベンチマークに連動する成果を目指す手法をパッシブ（インデックス）運用という。"}, {"id": "F036", "category": "金融資産運用", "type": "mc", "q": "投資信託の運用手法で、ベンチマークを上回る運用成果を目指すものを何というか。", "choices": ["アクティブ運用", "パッシブ運用", "ボトムアップ運用"], "answer": 0, "exp": "ベンチマークを上回る成果を目指す手法をアクティブ運用という。"}, {"id": "F037", "category": "金融資産運用", "type": "mc", "q": "アクティブ運用の手法のうち、個別企業の財務分析や経営者へのヒアリングなどの調査をもとに銘柄を選定する手法を何というか。", "choices": ["トップダウン・アプローチ", "ボトムアップ・アプローチ", "グロース投資"], "answer": 1, "exp": "個別企業の分析から積み上げていく手法をボトムアップ・アプローチという。"}, {"id": "F038", "category": "金融資産運用", "type": "mc", "q": "投資信託の信託報酬はいつ支払うコストか。", "choices": ["購入時", "保有期間中", "換金時"], "answer": 1, "exp": "信託報酬は、投資信託の保有期間中に信託財産から日々差し引かれる管理費用である。"}, {"id": "F039", "category": "金融資産運用", "type": "mc", "q": "外貨預金において、預金者が「円」を「外貨」に換えて預け入れる際に適用される為替レートはどれか。", "choices": ["TTM", "TTS", "TTB"], "answer": 1, "exp": "顧客が円を外貨にする（銀行が外貨を売る）レートはTTS（Telegraphic Transfer Selling rate）である。"}, {"id": "F040", "category": "金融資産運用", "type": "mc", "q": "外貨預金において、預金者が「外貨」を「円」に換えて引き出す際に適用される為替レートはどれか。", "choices": ["TTM", "TTS", "TTB"], "answer": 2, "exp": "顧客が外貨を円にする（銀行が外貨を買う）レートはTTB（Telegraphic Transfer Buying rate）である。"}, {"id": "F041", "category": "金融資産運用", "type": "mc", "q": "現在1米ドル＝100円、円から米ドルへの交換手数料が1ドルあたり1円のとき、100万円を米ドルに換える場合、適用されるレート(TTS)と交換できるドル額はいくらか。", "choices": ["TTS 99円、約10,101ドル", "TTS 101円、約9,900ドル", "TTS 101円、約9,901ドル"], "answer": 2, "exp": "TTS＝100円＋1円＝101円。100万円÷101円＝9,900.99...より約9,901ドル。"}, {"id": "F042", "category": "金融資産運用", "type": "mc", "q": "外貨預金の利息に対する税金（源泉分離課税）の税率は、復興特別所得税を含めていくらか。", "choices": ["15.315%", "20.315%", "20.000%"], "answer": 1, "exp": "利子所得として20.315%（国税15.315%、地方税5%）の源泉分離課税となる。"}, {"id": "F043", "category": "金融資産運用", "type": "mc", "q": "外貨預金の為替差益は、所得税法上どの所得に分類されるか（事業等を除く）。", "choices": ["利子所得", "一時所得", "雑所得"], "answer": 2, "exp": "外貨預金の為替差益は原則として雑所得となり、総合課税の対象となる。"}, {"id": "F044", "category": "金融資産運用", "type": "mc", "q": "ポートフォリオの期待収益率は、組み入れた各資産の期待収益率をどのように計算して求めるか。", "choices": ["各資産の期待収益率の単純平均", "各資産の期待収益率の加重平均", "各資産の期待収益率のうち最大の数値"], "answer": 1, "exp": "ポートフォリオの期待収益率は、各資産の期待収益率を組入比率で加重平均して求める。"}, {"id": "F045", "category": "金融資産運用", "type": "mc", "q": "ポートフォリオ運用におけるリスク低減効果を表す指標として「相関係数」がある。相関係数のとり得る範囲はどれか。", "choices": ["0から1まで", "-1から1まで", "-100から100まで"], "answer": 1, "exp": "相関係数は－1から＋1までの値をとる。"}, {"id": "F046", "category": "金融資産運用", "type": "mc", "q": "2つの資産を組み合わせてポートフォリオを構築する場合、リスク低減効果が最も大きくなるのは相関係数がいくつのときか。", "choices": ["+1", "0", "-1"], "answer": 2, "exp": "相関係数が－1（全く逆の動きをする）のとき、リスク低減効果が最大となる。"}, {"id": "F047", "category": "金融資産運用", "type": "mc", "q": "株式投資において、企業の将来の成長性が高いと見込まれ、現在の株価が利益や純資産に対して割高であっても投資する手法を何というか。", "choices": ["バリュー投資", "グロース投資", "インデックス投資"], "answer": 1, "exp": "企業の高い成長性に注目する投資手法をグロース投資という。"}, {"id": "F048", "category": "金融資産運用", "type": "mc", "q": "株式投資において、企業の利益や純資産などの本来の価値に対して、現在の株価が割安であると判断される銘柄に投資する手法を何というか。", "choices": ["バリュー投資", "グロース投資", "インデックス投資"], "answer": 0, "exp": "本来の価値より割安に放置されている銘柄を狙う手法をバリュー投資という。"}, {"id": "F049", "category": "金融資産運用", "type": "mc", "q": "NISA（少額投資非課税制度）の「つみたて投資枠」の年間非課税投資枠の上限はいくらか。", "choices": ["120万円", "240万円", "360万円"], "answer": 0, "exp": "2024年からの新NISAにおいて、つみたて投資枠の年間上限は120万円である。"}, {"id": "F050", "category": "金融資産運用", "type": "mc", "q": "NISA（少額投資非課税制度）の「成長投資枠」と「つみたて投資枠」を併用した場合の、年間の最大投資可能額はいくらか。", "choices": ["120万円", "240万円", "360万円"], "answer": 2, "exp": "成長投資枠（240万円）とつみたて投資枠（120万円）を併用し、年間最大360万円の投資が可能。"}, {"id": "T001", "category": "タックスプランニング", "type": "mc", "q": "所得税は、原則として個人のいつからいつまでに生じた所得に対して課税されるか。", "choices": ["4月1日から翌年3月31日", "1月1日から12月31日", "生年月日を基準とする1年間"], "answer": 1, "exp": "所得税は、暦年（1月1日から12月31日まで）に生じた所得に対して課税される。"}, {"id": "T002", "category": "タックスプランニング", "type": "mc", "q": "次のうち、所得税法上、非課税所得となるものはどれか。", "choices": ["老齢基礎年金", "遺族基礎年金", "公社債の利子"], "answer": 1, "exp": "遺族年金や障害年金、雇用保険の基本手当などは非課税所得となる。"}, {"id": "T003", "category": "タックスプランニング", "type": "mc", "q": "給与所得の金額の計算式として正しいものはどれか。", "choices": ["給与収入 － 基礎控除", "給与収入 － 給与所得控除額", "給与収入 － 必要経費"], "answer": 1, "exp": "給与所得の金額は、「給与収入金額 － 給与所得控除額」で計算される。"}, {"id": "T004", "category": "タックスプランニング", "type": "mc", "q": "退職所得の金額の計算式（特定役員等を除く）として正しいものはどれか。", "choices": ["(退職収入 － 退職所得控除額) × 1/2", "退職収入 － 退職所得控除額", "(退職収入 － 基礎控除) × 1/2"], "answer": 0, "exp": "退職所得は原則として、「（退職収入金額 － 退職所得控除額）× 1/2」で計算される。"}, {"id": "T005", "category": "タックスプランニング", "type": "mc", "q": "青色申告特別控除の最大控除額はいくらか（e-Taxによる電子申告等を行う場合）。", "choices": ["10万円", "55万円", "65万円"], "answer": 2, "exp": "正規の簿記の原則による記帳等を行い、e-Taxによる電子申告等を満たす場合、最大65万円の控除が受けられる。"}, {"id": "T006", "category": "タックスプランニング", "type": "mc", "q": "所得税の損益通算において、損失の金額を他の所得金額から控除できる所得はどれか。", "choices": ["一時所得", "雑所得", "不動産所得"], "answer": 2, "exp": "損益通算ができる損失は、不動産所得、事業所得、山林所得、譲渡所得（不動産等以外）の4つである。"}, {"id": "T007", "category": "タックスプランニング", "type": "mc", "q": "所得税の基礎控除について、2025年度税制改正後の説明として正しいものはどれか。", "choices": ["合計所得金額にかかわらず一律48万円", "合計所得金額に応じた段階的な控除（最大95万円）に変更された", "廃止された"], "answer": 1, "exp": "2025年度税制改正により、基礎控除は従来の一律48万円から合計所得金額に応じた段階制（低所得層は最大95万円、2025・2026年は時限的加算あり）に変更された。"}, {"id": "T008", "category": "タックスプランニング", "type": "mc", "q": "医療費控除の控除額の計算において、対象となる医療費から差し引かれる足切り額は、原則としていくらか（総所得金額等が200万円以上の場合）。", "choices": ["5万円", "10万円", "20万円"], "answer": 1, "exp": "医療費控除の足切り額は、原則として10万円（総所得金額200万円未満の場合はその5%）である。"}, {"id": "T009", "category": "タックスプランニング", "type": "mc", "q": "住宅借入金等特別控除（住宅ローン控除）を受けるための要件のうち、家屋の床面積の要件はどれか（特例を除く）。", "choices": ["50平方メートル以上", "40平方メートル以上", "30平方メートル以上"], "answer": 0, "exp": "原則として、取得した家屋の床面積が50平方メートル以上で、その半分以上が専ら自己の居住用であることが要件。"}, {"id": "T010", "category": "タックスプランニング", "type": "mc", "q": "所得税の確定申告の提出期間は、原則としていつからいつまでか。", "choices": ["翌年1月1日から1月31日", "翌年2月16日から3月15日", "翌年3月1日から3月31日"], "answer": 1, "exp": "原則として、所得が生じた年の翌年2月16日から3月15日までに確定申告を行う必要がある。"}, {"id": "E001", "category": "不動産", "type": "mc", "q": "不動産の登記記録において、所有権に関する事項が記録されるのはどの部分か。", "choices": ["表題部", "権利部（甲区）", "権利部（乙区）"], "answer": 1, "exp": "権利部（甲区）には所有権に関する事項が、権利部（乙区）には所有権以外の権利（抵当権など）が記録される。"}, {"id": "E002", "category": "不動産", "type": "mc", "q": "不動産の価格のうち、国土交通省が毎年1月1日を標準日として判定し、一般の土地取引価格の指標となるものはどれか。", "choices": ["地価公示価格", "基準地標準価格", "路線価"], "answer": 0, "exp": "地価公示価格は国交省が1月1日基準で公表する。路線価は国税庁（7月）、基準地標準価格は都道府県（7月）。"}, {"id": "E003", "category": "不動産", "type": "mc", "q": "宅地建物取引業法において、専任媒介契約の有効期間は最長で何か月か。", "choices": ["1か月", "3か月", "6か月"], "answer": 1, "exp": "専任媒介契約および専属専任媒介契約の有効期間は最長3か月である。"}, {"id": "E004", "category": "不動産", "type": "mc", "q": "借地借家法における「定期借地権（一般定期借地権）」の存続期間は原則として何年以上か。", "choices": ["10年以上", "30年以上", "50年以上"], "answer": 2, "exp": "一般定期借地権の存続期間は50年以上。契約の更新や建物の築造による存続期間の延長はない。"}, {"id": "E005", "category": "不動産", "type": "mc", "q": "借地借家法における「定期建物賃貸借（定期借家契約）」を締結する際、契約方法はどのように定められているか。", "choices": ["口頭でも有効", "書面による契約が必要", "公正証書による契約が必要"], "answer": 1, "exp": "定期建物賃貸借契約は、公正証書等の「書面」で行う必要がある（事業用定期借地権とは異なり公正証書に限定されない）。"}, {"id": "E006", "category": "不動産", "type": "mc", "q": "都市計画法において、市街化区域で行う開発行為で、原則として都道府県知事等の許可が必要となる面積はどれか。", "choices": ["500平方メートル以上", "1,000平方メートル以上", "3,000平方メートル以上"], "answer": 1, "exp": "市街化区域における開発行為は、原則1,000平方メートル以上で都道府県知事等の許可が必要。"}, {"id": "E007", "category": "不動産", "type": "mc", "q": "建築基準法における「建蔽率（けんぺいりつ）」の計算式はどれか。", "choices": ["建築面積 ÷ 敷地面積", "延べ面積 ÷ 敷地面積", "建築面積 ÷ 延べ面積"], "answer": 0, "exp": "建蔽率は「建築面積の敷地面積に対する割合」。延べ面積を用いた割合は「容積率」である。"}, {"id": "E008", "category": "不動産", "type": "mc", "q": "用途地域のうち、主として住居の環境を保護するための地域で、店舗等の制限が最も厳しいのはどれか。", "choices": ["第一種低層住居専用地域", "第一種住居地域", "近隣商業地域"], "answer": 0, "exp": "第一種低層住居専用地域は、低層住宅のための良好な住居の環境を保護する地域である。"}, {"id": "E009", "category": "不動産", "type": "mc", "q": "不動産を取得した際に課される不動産取得税は、国税か地方税（都道府県税・市町村税）か。", "choices": ["国税", "都道府県税", "市町村税"], "answer": 1, "exp": "不動産取得税は地方税（都道府県税）である。固定資産税は市町村税。"}, {"id": "E010", "category": "不動産", "type": "mc", "q": "居住用財産を譲渡した場合の3,000万円特別控除は、所有期間に関係なく適用を受けられるか。", "choices": ["所有期間5年超のみ適用", "所有期間10年超のみ適用", "所有期間に関係なく適用される"], "answer": 2, "exp": "居住用財産の3,000万円特別控除は、所有期間の長短に関わらず適用要件を満たせば受けられる。"}, {"id": "S001", "category": "相続・事業承継", "type": "mc", "q": "被相続人に配偶者と子がいる場合、配偶者の法定相続分はいくらか。", "choices": ["1/3", "1/2", "2/3"], "answer": 1, "exp": "配偶者と子が相続人の場合、法定相続分は配偶者1/2、子1/2となる。"}, {"id": "S002", "category": "相続・事業承継", "type": "mc", "q": "代襲相続において、兄弟姉妹が相続人となる場合、その兄弟姉妹が死亡等しているとき代襲相続人となるのは誰か。", "choices": ["兄弟姉妹の子（甥・姪）まで", "兄弟姉妹の孫まで", "無制限に代襲する"], "answer": 0, "exp": "兄弟姉妹の代襲相続は一代限り（甥・姪まで）であり、再代襲は認められない。"}, {"id": "S003", "category": "相続・事業承継", "type": "mc", "q": "自筆証書遺言において、財産目録をパソコン等で作成することは認められているか。", "choices": ["すべて自書しなければならない", "財産目録のみパソコン等での作成が認められている", "すべてパソコン等での作成が認められている"], "answer": 1, "exp": "自筆証書遺言でも、財産目録についてはパソコンでの作成や通帳のコピーの添付が認められている。"}, {"id": "S004", "category": "相続・事業承継", "type": "mc", "q": "法定相続人のうち、遺留分（最低限の取り分）が認められていないのは誰か。", "choices": ["配偶者", "直系尊属（父母など）", "兄弟姉妹"], "answer": 2, "exp": "兄弟姉妹には遺留分は認められていない。"}, {"id": "S005", "category": "相続・事業承継", "type": "mc", "q": "相続の放棄をする場合、原則として自己のために相続の開始があったことを知った時から何か月以内に家庭裁判所に申述しなければならないか。", "choices": ["1か月以内", "3か月以内", "10か月以内"], "answer": 1, "exp": "相続放棄および限定承認は、原則として3か月以内に家庭裁判所に申述する必要がある。"}, {"id": "S006", "category": "相続・事業承継", "type": "mc", "q": "相続税の基礎控除額を求める計算式はどれか。", "choices": ["3,000万円 ＋ 600万円 × 法定相続人の数", "5,000万円 ＋ 1,000万円 × 法定相続人の数", "3,000万円 ＋ 1,000万円 × 法定相続人の数"], "answer": 0, "exp": "相続税の基礎控除額は「3,000万円 ＋ 600万円 × 法定相続人の数」である。"}, {"id": "S007", "category": "相続・事業承継", "type": "mc", "q": "被相続人の死亡によって支払われる生命保険金のうち、相続税の非課税限度額の計算式はどれか。", "choices": ["500万円 × 法定相続人の数", "600万円 × 法定相続人の数", "1,000万円 × 法定相続人の数"], "answer": 0, "exp": "死亡保険金や死亡退職金の非課税限度額は「500万円 × 法定相続人の数」である。"}, {"id": "S008", "category": "相続・事業承継", "type": "mc", "q": "暦年課税による贈与税の基礎控除額は、受贈者1人につき年間いくらか。", "choices": ["60万円", "110万円", "2,500万円"], "answer": 1, "exp": "暦年課税の基礎控除額は、受贈者1人当たり年間110万円である。"}, {"id": "S009", "category": "相続・事業承継", "type": "mc", "q": "相続時精算課税制度を選択した場合の特別控除額（累計）は最大いくらか。", "choices": ["1,000万円", "1,500万円", "2,500万円"], "answer": 2, "exp": "相続時精算課税制度では、累計2,500万円までの特別控除が認められている。"}, {"id": "S010", "category": "相続・事業承継", "type": "mc", "q": "取引相場のない株式（非上場株式）の原則的評価方式において、会社の業種や規模に応じて適用される方式は「純資産価額方式」ともう一つは何か。", "choices": ["配当還元方式", "類似業種比準方式", "収益還元方式"], "answer": 1, "exp": "同族株主等が取得する場合は原則的評価方式（類似業種比準方式と純資産価額方式等）により評価する。"}, {"id": "L021", "category": "ライフプランニング", "type": "mc", "q": "ファイナンシャル・プランナーが顧客のライフプランニングを行う際に作成する、顧客の将来の収入・支出や貯蓄残高の推移を時系列に表した表を何というか。", "choices": ["キャッシュフロー表", "個人バランスシート", "ライフイベント表"], "answer": 0, "exp": "キャッシュフロー表は、現在の収支状況や将来のライフイベントを基に、将来の収支や貯蓄残高の推移を予測した表である。"}, {"id": "L022", "category": "ライフプランニング", "type": "mc", "q": "公的医療保険の高額療養費制度において、自己負担限度額の算定における対象とならない費用はどれか。", "choices": ["処方箋による調剤代", "差額ベッド代や入院時の食事療養の標準負担額", "手術代"], "answer": 1, "exp": "差額ベッド代、食事代、先進医療の技術料などは高額療養費の対象外。"}, {"id": "L023", "category": "ライフプランニング", "type": "mc", "q": "全国健康保険協会管掌健康保険（協会けんぽ）の被保険者が業務外の事由による療養のため労務に服することができず給与を受けられない場合、原則として何日目から傷病手当金が支給されるか。", "choices": ["起算して3日目", "起算して4日目", "起算して8日目"], "answer": 1, "exp": "連続する3日間（待期期間）の後、4日目から支給される。"}, {"id": "L024", "category": "ライフプランニング", "type": "mc", "q": "雇用保険の基本手当（失業給付）の受給要件として、原則として離職の日以前の2年間に被保険者期間が通算して何か月以上あることが必要か（特定受給資格者等を除く）。", "choices": ["6か月", "12か月", "24か月"], "answer": 1, "exp": "原則として離職前2年間に被保険者期間が12か月以上必要。"}, {"id": "L025", "category": "ライフプランニング", "type": "mc", "q": "労働者災害補償保険（労災保険）の保険料は誰が負担するか。", "choices": ["全額を事業主が負担", "事業主と労働者が折半", "全額を労働者が負担"], "answer": 0, "exp": "労災保険料は全額事業主負担。雇用保険料は労使双方負担。"}, {"id": "L026", "category": "ライフプランニング", "type": "mc", "q": "国民年金の第1号被保険者となる対象者はどれか。", "choices": ["会社員", "公務員", "自営業者や学生"], "answer": 2, "exp": "自営業、農業・漁業者、学生、無職の者などは第1号被保険者。"}, {"id": "L027", "category": "ライフプランニング", "type": "mc", "q": "老齢基礎年金の受給資格期間（保険料納付済期間や免除期間などの合計）は、原則として何年以上必要か。", "choices": ["10年", "25年", "40年"], "answer": 0, "exp": "老齢基礎年金を受けるためには受給資格期間が10年以上必要。"}, {"id": "L028", "category": "ライフプランニング", "type": "mc", "q": "老齢厚生年金の受給開始年齢は原則65歳だが、繰上げ受給した場合、年金額は1か月あたり何％減額されるか（昭和37年4月2日以後生まれ）。", "choices": ["0.3%", "0.4%", "0.5%"], "answer": 1, "exp": "昭和37年4月2日以後生まれの場合、1か月あたり0.4%の減額。"}, {"id": "L029", "category": "ライフプランニング", "type": "mc", "q": "老齢基礎年金を70歳まで繰り下げて受給した場合、年金額は最大で何％増額されるか。", "choices": ["42.0%", "60.0%", "84.0%"], "answer": 0, "exp": "1か月0.7%の増額。60か月（5年）で42.0%の増額。"}, {"id": "L030", "category": "ライフプランニング", "type": "mc", "q": "遺族基礎年金を受給できる遺族の要件として正しいものはどれか。", "choices": ["配偶者または子", "子のある配偶者または子", "すべての親族"], "answer": 1, "exp": "死亡した者に生計を維持されていた「子のある配偶者」または「子」に支給。"}, {"id": "L031", "category": "ライフプランニング", "type": "mc", "q": "住宅金融支援機構と民間金融機関が提携する「フラット35」の融資額の上限はいくらか。", "choices": ["5,000万円", "8,000万円", "1億円"], "answer": 1, "exp": "融資額の上限は8,000万円（かつ購入価額の100%以内）。"}, {"id": "L032", "category": "ライフプランニング", "type": "mc", "q": "借入金額、金利、返済期間が同じ場合、総返済額が少なくなるのはどちらか。", "choices": ["元利均等返済", "元金均等返済", "どちらも同じ"], "answer": 1, "exp": "元金均等返済は元金の減りが早く、総返済額は少なくなる。"}, {"id": "L033", "category": "ライフプランニング", "type": "mc", "q": "日本学生支援機構の奨学金のうち、原則として返還義務がないものはどれか。", "choices": ["第一種奨学金", "第二種奨学金", "給付型奨学金"], "answer": 2, "exp": "給付型は返還義務なし。第一種・第二種は貸与型。"}, {"id": "L034", "category": "ライフプランニング", "type": "mc", "q": "確定拠出年金（iDeCoなど）の掛金は、税務上どのような取り扱いになるか。", "choices": ["小規模企業共済等掛金控除の対象", "生命保険料控除の対象", "所得控除の対象外"], "answer": 0, "exp": "掛金全額が小規模企業共済等掛金控除の対象となる。"}, {"id": "L035", "category": "ライフプランニング", "type": "mc", "q": "国民年金基金の掛金上限は、確定拠出年金の掛金と合算して月額いくらか（第1号被保険者）。", "choices": ["23,000円", "68,000円", "12,000円"], "answer": 1, "exp": "第1号被保険者の上限はiDeCoと合算して月額68,000円。"}, {"id": "L036", "category": "ライフプランニング", "type": "mc", "q": "個人の可処分所得を求める計算式として正しいものはどれか。", "choices": ["収入金額 － 所得税 － 住民税", "収入金額 － 所得税 － 住民税 － 社会保険料", "収入金額 － 基本生活費"], "answer": 1, "exp": "可処分所得＝年収－（所得税＋住民税＋社会保険料）。いわゆる手取り額。"}, {"id": "L037", "category": "ライフプランニング", "type": "mc", "q": "健康保険の任意継続被保険者となることができる期間は、最長で何年間か。", "choices": ["1年間", "2年間", "3年間"], "answer": 1, "exp": "任意継続被保険者の期間は最長2年間である。"}, {"id": "L038", "category": "ライフプランニング", "type": "mc", "q": "健康保険の出産手当金の支給額は、原則として1日につき標準報酬日額の何分のいくらか。", "choices": ["1/2", "2/3", "3/4"], "answer": 1, "exp": "出産手当金は、原則として休んだ日1日につき標準報酬日額の3分の2に相当する額が支給される。"}, {"id": "L039", "category": "ライフプランニング", "type": "mc", "q": "育児休業給付金の支給額は、育児休業開始から最初の6か月間は、休業開始時賃金日額の何％か。", "choices": ["50%", "67%", "80%"], "answer": 1, "exp": "最初の6か月は67%、6か月経過後は50%となる。"}, {"id": "L040", "category": "ライフプランニング", "type": "mc", "q": "介護保険の第1号被保険者となるのは何歳以上の者か。", "choices": ["40歳以上", "60歳以上", "65歳以上"], "answer": 2, "exp": "第1号被保険者は65歳以上、第2号被保険者は40歳以上65歳未満の医療保険加入者。"}, {"id": "L041", "category": "ライフプランニング", "type": "mc", "q": "介護保険の第2号被保険者となる年齢要件はどれか。", "choices": ["20歳以上60歳未満", "40歳以上65歳未満", "65歳以上"], "answer": 1, "exp": "40歳以上65歳未満の医療保険加入者が第2号被保険者となる。"}, {"id": "L042", "category": "ライフプランニング", "type": "mc", "q": "老齢基礎年金を満額受給するためには、保険料納付済期間等が何月必要か。", "choices": ["300月", "480月", "600月"], "answer": 1, "exp": "20歳から60歳までの40年間（480月）すべての保険料を納付した場合に満額支給される。"}, {"id": "L043", "category": "ライフプランニング", "type": "mc", "q": "障害基礎年金の等級はいくつに区分されているか。", "choices": ["1級・2級", "1級・2級・3級", "1級から4級"], "answer": 0, "exp": "障害基礎年金は1級と2級。障害厚生年金には1級から3級および障害手当金がある。"}, {"id": "L044", "category": "ライフプランニング", "type": "mc", "q": "遺族厚生年金を受給できる遺族のうち、最も優先順位が高いのは誰か。", "choices": ["父母", "孫", "配偶者および子"], "answer": 2, "exp": "優先順位は配偶者・子＞父母＞孫＞祖父母の順。"}, {"id": "L045", "category": "ライフプランニング", "type": "mc", "q": "遺族厚生年金の額は、原則として死亡した者の老齢厚生年金の報酬比例部分の計算式によって算出した額の何分のいくらか。", "choices": ["1/2", "2/3", "3/4"], "answer": 2, "exp": "原則として、老齢厚生年金の報酬比例部分の金額の4分の3相当額である。"}, {"id": "L046", "category": "ライフプランニング", "type": "mc", "q": "将来受け取る年金額があらかじめ約束されている企業年金制度はどれか。", "choices": ["確定給付企業年金（DB）", "確定拠出年金（DC）", "財形年金貯蓄"], "answer": 0, "exp": "確定給付企業年金（DB）は将来の給付額が約束されている。DCは運用成績により変動する。"}, {"id": "L047", "category": "ライフプランニング", "type": "mc", "q": "個人型確定拠出年金（iDeCo）に加入できるのは、原則として何歳未満の者か。", "choices": ["60歳未満", "65歳未満", "70歳未満"], "answer": 1, "exp": "2022年の法改正により、原則として65歳未満の国民年金被保険者が加入可能となった。"}, {"id": "L048", "category": "ライフプランニング", "type": "mc", "q": "企業型確定拠出年金（企業型DC）に加入できるのは、原則として何歳未満の厚生年金保険の被保険者か。", "choices": ["60歳未満", "65歳未満", "70歳未満"], "answer": 2, "exp": "2022年の法改正により、原則として70歳未満の厚生年金被保険者が加入可能となった。"}, {"id": "L049", "category": "ライフプランニング", "type": "mc", "q": "住宅ローンの繰上返済において、毎回の返済額を変えずに返済期間を短くする方法を何というか。", "choices": ["返済額軽減型", "期間短縮型", "元金均等返済"], "answer": 1, "exp": "期間短縮型は毎回の返済額を変えずに残りの返済期間を短くする。利息軽減効果が高い。"}, {"id": "L050", "category": "ライフプランニング", "type": "mc", "q": "日本政策金融公庫の「教育一般貸付（国の教育ローン）」の融資限度額は、学生1人につき原則いくらか。", "choices": ["200万円", "350万円", "500万円"], "answer": 1, "exp": "融資限度額は原則350万円（一定の条件を満たす場合は450万円）。"}, {"id": "R051", "category": "リスク管理", "type": "mc", "q": "生命保険において、保険会社が約束する予定の運用利回りを何というか。", "choices": ["予定死亡率", "予定利率", "予定事業費率"], "answer": 1, "exp": "予定利率が高いほど保険料は安くなる。"}, {"id": "R052", "category": "リスク管理", "type": "mc", "q": "保険料を払い込まなかった場合でも、契約が直ちに失効しないよう設けられている期間はどれか。", "choices": ["待期期間", "猶予期間", "免責期間"], "answer": 1, "exp": "猶予期間内に払い込めば契約は有効。"}, {"id": "R053", "category": "リスク管理", "type": "mc", "q": "終身保険の特徴として正しいものはどれか。", "choices": ["一定期間保障、満期保険金あり", "一生涯保障、満期保険金なし", "一定期間ごとに生存給付金あり"], "answer": 1, "exp": "終身保険は保障が一生涯続き、満期保険金はない。"}, {"id": "R054", "category": "リスク管理", "type": "mc", "q": "養老保険の特徴として正しいものはどれか。", "choices": ["死亡保険金と満期保険金が同額", "死亡保険金がなく満期保険金のみ", "一生涯の保障がある"], "answer": 0, "exp": "死亡時は死亡保険金、満期時は同額の満期保険金が支払われる。"}, {"id": "R055", "category": "リスク管理", "type": "mc", "q": "特定疾病保障保険の一般的な三大疾病の組み合わせはどれか。", "choices": ["がん、心筋梗塞、脳卒中", "がん、糖尿病、高血圧性疾患", "心筋梗塞、脳卒中、糖尿病"], "answer": 0, "exp": "がん（悪性新生物）、急性心筋梗塞、脳卒中が対象。"}, {"id": "R056", "category": "リスク管理", "type": "mc", "q": "将来の保険金支払いの財源となる保険料はどれか。", "choices": ["純保険料", "付加保険料", "解約返戻金"], "answer": 0, "exp": "純保険料が保険金の財源。付加保険料は運営経費。"}, {"id": "R057", "category": "リスク管理", "type": "mc", "q": "解約返戻金が払い込んだ保険料の総額を下回るリスクを何というか。", "choices": ["金利変動リスク", "インフレリスク", "元本割れリスク"], "answer": 2, "exp": "中途解約時に払込累計額を下回る元本割れのリスク。"}, {"id": "R058", "category": "リスク管理", "type": "mc", "q": "被保険者の生死に関わらず、定めた期間年金が受け取れるものはどれか。", "choices": ["終身年金", "確定年金", "有期年金"], "answer": 1, "exp": "確定年金は期間中死亡しても遺族に残りの年金が支払われる。"}, {"id": "R059", "category": "リスク管理", "type": "mc", "q": "損害保険における対象財産の最高限度額（評価額）を何というか。", "choices": ["保険金額", "保険価額", "保険料"], "answer": 1, "exp": "保険価額は損害の最高見積額。保険金額は契約上の支払上限。"}, {"id": "R060", "category": "リスク管理", "type": "mc", "q": "現在同等の建物を新築・購入するために必要な金額の基準を何というか。", "choices": ["新価（再調達価額）", "時価", "減価償却費"], "answer": 0, "exp": "新価は同等物を再建築等するのに必要な金額。"}, {"id": "R061", "category": "リスク管理", "type": "mc", "q": "自賠責保険の被害者1名あたりの死亡損害の支払限度額はいくらか。", "choices": ["1,200万円", "3,000万円", "4,000万円"], "answer": 1, "exp": "死亡は3,000万円、傷害120万円、後遺障害最高4,000万円。"}, {"id": "R062", "category": "リスク管理", "type": "mc", "q": "事故による被保険者自身や同乗者の死傷損害に対して支払われる自動車保険はどれか。", "choices": ["対人賠償保険", "対物賠償保険", "人身傷害（補償）保険"], "answer": 2, "exp": "過失割合に関わらず実際の損害額が設定金額内で支払われる。"}, {"id": "R063", "category": "リスク管理", "type": "mc", "q": "地震保険は単独で加入できるか。", "choices": ["単独で加入できる", "火災保険とセットでなければ不可", "生命保険とセットでなければ不可"], "answer": 1, "exp": "地震保険は必ず火災保険に付帯して契約する。"}, {"id": "R064", "category": "リスク管理", "type": "mc", "q": "個人賠償責任保険の補償対象とならない事由はどれか。", "choices": ["自転車で他人にケガをさせた", "買い物中に商品を壊した", "業務中に他人の財物を壊した"], "answer": 2, "exp": "業務遂行中の事故や自動車事故は対象外。"}, {"id": "R065", "category": "リスク管理", "type": "mc", "q": "生命保険の死亡保険金の非課税限度額が適用されるのはどのケースか。", "choices": ["契約者と受取人が異なる", "契約者と被保険者が同一", "満期保険金"], "answer": 1, "exp": "契約者＝被保険者の死亡保険金は相続税の対象となり非課税枠がある。"}, {"id": "R066", "category": "リスク管理", "type": "mc", "q": "生命保険の保険料計算に用いられる「予定死亡率」が高く見積もられた場合、死亡保険の保険料はどうなるか。", "choices": ["安くなる", "高くなる", "変わらない"], "answer": 1, "exp": "予定死亡率（死亡する確率）が高くなると、保険金支払いの可能性が高まるため保険料は高くなる。"}, {"id": "R067", "category": "リスク管理", "type": "mc", "q": "生命保険の保険料計算に用いられる「予定事業費率」が高く見積もられた場合、保険料はどうなるか。", "choices": ["安くなる", "高くなる", "変わらない"], "answer": 1, "exp": "予定事業費率（保険会社の運営経費の割合）が高くなると、保険料は高くなる。"}, {"id": "R068", "category": "リスク管理", "type": "mc", "q": "保険期間が一定で、満期保険金がなく、掛け捨て型の死亡保険を何というか。", "choices": ["終身保険", "定期保険", "養老保険"], "answer": 1, "exp": "定期保険は一定期間のみ保障され、満期保険金や解約返戻金がない（またはごくわずか）ため保険料が割安。"}, {"id": "R069", "category": "リスク管理", "type": "mc", "q": "被保険者が死亡した場合、保険金を年金形式で受け取るタイプの保険を何というか。", "choices": ["収入保障保険（家族収入保険）", "特定疾病保障保険", "こども保険"], "answer": 0, "exp": "収入保障保険は、死亡時から保険期間満了時まで年金形式で保険金を受け取る。"}, {"id": "R070", "category": "リスク管理", "type": "mc", "q": "被保険者の余命が6か月以内と診断された場合、死亡保険金の一部または全部を生前に受け取れる特約を何というか。", "choices": ["指定代理請求特約", "リビング・ニーズ特約", "災害割増特約"], "answer": 1, "exp": "リビング・ニーズ特約による生前給付金は非課税となる。"}, {"id": "R071", "category": "リスク管理", "type": "mc", "q": "現在加入している生命保険の解約返戻金や積立配当金を下取りにして、新たな契約に充当する制度を何というか。", "choices": ["払済保険", "延長保険", "契約転換制度"], "answer": 2, "exp": "契約転換制度により、新たな保険料負担を軽減できるが、転換時の年齢・保険料率で計算される。"}, {"id": "R072", "category": "リスク管理", "type": "mc", "q": "以後の保険料の払込みを中止し、その時点の解約返戻金をもとに「保険期間は変えず」に保険金額を減額した保険に変更するものを何というか。", "choices": ["払済保険", "延長保険", "契約転換"], "answer": 0, "exp": "払済保険は保険期間が元のままで、保険金額が元の契約より少なくなる。"}, {"id": "R073", "category": "リスク管理", "type": "mc", "q": "以後の保険料の払込みを中止し、その時点の解約返戻金をもとに「保険金額は変えず」に定期保険に変更するものを何というか。", "choices": ["払済保険", "延長保険", "契約転換"], "answer": 1, "exp": "延長保険は元の保険金額のままであるが、保険期間が短くなるのが一般的。"}, {"id": "R074", "category": "リスク管理", "type": "mc", "q": "生命保険契約を申し込んだ後、一定期間内であれば無条件で申込みの撤回や契約の解除ができる制度を何というか。", "choices": ["クーリング・オフ制度", "猶予期間制度", "復活制度"], "answer": 0, "exp": "原則として、申込日または重要事項説明書受領日のいずれか遅い日から起算して8日以内であればクーリング・オフ可能。"}, {"id": "R075", "category": "リスク管理", "type": "mc", "q": "生命保険会社が破綻した場合、生命保険契約者保護機構によって補償されるのは、原則として破綻時点の何％か。", "choices": ["責任準備金の80％", "責任準備金の90％", "責任準備金の100％"], "answer": 1, "exp": "原則として破綻時点の責任準備金（将来の保険金支払いのための積立金）の90%が補償される。"}, {"id": "R076", "category": "リスク管理", "type": "mc", "q": "自動車保険の車両保険のうち、当て逃げや自転車との接触による損害が補償されないのはどちらか。", "choices": ["一般条件（一般型）", "エコノミー型（車対車＋限定A等）", "どちらも補償されない"], "answer": 1, "exp": "エコノミー型は補償範囲が狭く、単独事故や当て逃げは補償対象外となることが多い。"}, {"id": "R077", "category": "リスク管理", "type": "mc", "q": "傷害保険において、保険金支払いの対象となる事故の要件として正しくないものはどれか。", "choices": ["急激性", "偶然性", "疾病（病気）"], "answer": 2, "exp": "傷害保険は「急激・偶然・外来」の事故によるケガを補償し、病気は対象外。"}, {"id": "R078", "category": "リスク管理", "type": "mc", "q": "家族傷害保険の被保険者の範囲に含まれないのは誰か。", "choices": ["本人の配偶者", "本人と同居している親族", "本人と別居している既婚の子"], "answer": 2, "exp": "別居の未婚の子は対象となるが、別居の既婚の子は対象外となる。"}, {"id": "R079", "category": "リスク管理", "type": "mc", "q": "病気やケガで就業不能となった場合の収入減を補償する保険で、支払いが開始されるまでの免責期間が設定されているものはどれか。", "choices": ["所得補償保険", "労働災害総合保険", "企業費用・利益総合保険"], "answer": 0, "exp": "所得補償保険は、病気やケガで働けない期間の収入を補償する。通常7日などの免責期間がある。"}, {"id": "R080", "category": "リスク管理", "type": "mc", "q": "損害保険会社が破綻した場合、損害保険契約者保護機構により、自動車保険や火災保険は原則として破綻後3か月経過後は何％補償されるか。", "choices": ["責任準備金の80％", "責任準備金の90％", "責任準備金の100％"], "answer": 0, "exp": "自賠責保険や地震保険は100%補償だが、自動車保険や火災保険等は破綻後3か月経過後は80%補償となる。"}, {"id": "L051", "category": "ライフプランニング", "type": "mc", "q": "年収600万円、所得税額20万円、住民税額30万円、社会保険料額90万円の場合の可処分所得の金額はいくらか。", "choices": ["460万円", "550万円", "490万円"], "answer": 0, "exp": "可処分所得＝年収－(所得税＋住民税＋社会保険料)＝600万円－(20万円＋30万円＋90万円)＝460万円。"}, {"id": "R081", "category": "リスク管理", "type": "mc", "q": "被保険者および契約者が父、死亡保険金受取人が長男で、死亡保険金額が2,000万円の場合。法定相続人が妻、長男、次男の計3人であるとき、死亡保険金の非課税金額の枠はいくらか。", "choices": ["500万円", "1,000万円", "1,500万円"], "answer": 2, "exp": "死亡保険金の非課税限度額＝500万円×法定相続人の数＝500万円×3人＝1,500万円。"}, {"id": "F051", "category": "金融資産運用", "type": "mc", "q": "表面利率(年率)2%、残存期間4年、購入価格101円、額面100円の固定利付債券を満期まで保有した場合の最終利回りはいくらか（税金等は考慮せず、小数点第3位以下四捨五入）。", "choices": ["1.73%", "1.98%", "2.00%"], "answer": 0, "exp": "最終利回り＝{2＋(100－101)÷4}÷101×100＝1.732...％。"}, {"id": "T011", "category": "タックスプランニング", "type": "mc", "q": "勤続年数25年の会社員が退職金2,000万円を受け取った。この場合の退職所得の金額はいくらか。（退職所得控除額：20年以下は1年につき40万円、20年超は1年につき70万円）", "choices": ["425万円", "850万円", "1,150万円"], "answer": 0, "exp": "退職所得控除額＝800万円＋70万円×(25年－20年)＝1,150万円。退職所得＝(2,000万円－1,150万円)×1/2＝425万円。"}, {"id": "E011", "category": "不動産", "type": "mc", "q": "指定容積率が400%、前面道路の幅員が6mである住居系用途地域の敷地における、基準容積率（延べ面積の敷地面積に対する割合の最高限度）はいくらか。", "choices": ["240%", "360%", "400%"], "answer": 0, "exp": "住居系用途地域における前面道路幅員による容積率制限＝6m×4/10（40%）＝240%。指定容積率400%と比較し、厳しい方（小さい方）の240%が適用される。"}, {"id": "S011", "category": "相続・事業承継", "type": "mc", "q": "被相続人に配偶者、長男、次男、長女（既に死亡、代襲相続人として孫が2人いる）がいる場合、相続税の基礎控除額はいくらか。", "choices": ["4,800万円", "5,400万円", "6,000万円"], "answer": 1, "exp": "法定相続人は配偶者、長男、次男、孫2人（長女の代襲）の計5人。基礎控除額＝3,000万円＋600万円×5人＝6,000万円。"}, {"id": "T012", "category": "タックスプランニング", "type": "mc", "q": "所得税の納税方式として正しいものはどれか。", "choices": ["申告納税方式", "賦課課税方式", "源泉徴収のみ方式"], "answer": 0, "exp": "所得税は納税者が自ら所得と税額を計算して申告・納付する申告納税方式を採用している。"}, {"id": "T013", "category": "タックスプランニング", "type": "mc", "q": "預貯金の利子に対する所得税の課税方式は原則としてどれか。", "choices": ["総合課税", "源泉分離課税", "申告分離課税"], "answer": 1, "exp": "預貯金の利子所得は原則として20.315%の源泉分離課税で課税関係が完結する。"}, {"id": "T014", "category": "タックスプランニング", "type": "mc", "q": "一時所得の金額の計算式として正しいものはどれか。", "choices": ["総収入金額 － 支出金額 － 特別控除50万円", "(総収入金額 － 支出金額 － 特別控除50万円)", "総収入金額 × 1/2"], "answer": 0, "exp": "一時所得＝総収入金額－その収入を得るための支出－特別控除額（最高50万円）。総所得に算入する際はさらに1/2する。"}, {"id": "T015", "category": "タックスプランニング", "type": "mc", "q": "一時所得を総所得金額に算入する際は、その金額の何分のいくらを算入するか。", "choices": ["全額", "2分の1", "3分の1"], "answer": 1, "exp": "一時所得は特別控除後の金額の2分の1を総所得金額に算入する。"}, {"id": "T016", "category": "タックスプランニング", "type": "mc", "q": "給与所得控除額の最低保障額は、2025年（令和7年）分以降いくらに引き上げられたか。", "choices": ["55万円", "65万円", "75万円"], "answer": 1, "exp": "2025年度税制改正により給与所得控除の最低保障額は55万円から65万円に引き上げられた。"}, {"id": "T017", "category": "タックスプランニング", "type": "mc", "q": "公的年金等の収入は所得税法上どの所得に分類されるか。", "choices": ["給与所得", "一時所得", "雑所得"], "answer": 2, "exp": "公的年金等は雑所得に分類され、公的年金等控除を差し引いて計算する。"}, {"id": "T018", "category": "タックスプランニング", "type": "mc", "q": "配偶者控除（一般の控除対象配偶者）の控除額は、納税者の合計所得金額900万円以下の場合いくらか。", "choices": ["38万円", "48万円", "63万円"], "answer": 0, "exp": "合計所得金額900万円以下の納税者の配偶者控除額は38万円である。"}, {"id": "T019", "category": "タックスプランニング", "type": "mc", "q": "控除対象扶養親族となるための被扶養者の合計所得金額の要件は、2025年改正後いくらか。", "choices": ["48万円以下", "58万円以下", "103万円以下"], "answer": 1, "exp": "2025年度税制改正により、扶養親族等の合計所得金額要件は48万円以下から58万円以下に引き上げられた。"}, {"id": "T020", "category": "タックスプランニング", "type": "mc", "q": "特定扶養親族（19歳以上23歳未満）の扶養控除額はいくらか。", "choices": ["38万円", "48万円", "63万円"], "answer": 2, "exp": "特定扶養親族の扶養控除額は63万円である。"}, {"id": "T021", "category": "タックスプランニング", "type": "mc", "q": "社会保険料控除の控除額はどのように計算されるか。", "choices": ["支払った額の2分の1", "支払った額の全額", "上限8万円まで"], "answer": 1, "exp": "社会保険料控除は、その年に支払った社会保険料の全額が所得控除の対象となる。"}, {"id": "T022", "category": "タックスプランニング", "type": "mc", "q": "地震保険料控除の所得税における控除限度額はいくらか。", "choices": ["最高4万円", "最高5万円", "最高12万円"], "answer": 1, "exp": "地震保険料控除は、所得税で支払保険料の全額（最高5万円）が控除される。"}, {"id": "T023", "category": "タックスプランニング", "type": "mc", "q": "ふるさと納税などの寄附金について適用される所得控除を何というか。", "choices": ["寄附金控除", "医療費控除", "雑損控除"], "answer": 0, "exp": "特定の寄附金を支出した場合、寄附金控除（所得控除）または寄附金特別控除（税額控除）の対象となる。"}, {"id": "T024", "category": "タックスプランニング", "type": "mc", "q": "会社員（給与所得者）が原則として確定申告を要するのは、給与の年間収入金額がいくらを超える場合か。", "choices": ["1,000万円", "2,000万円", "3,000万円"], "answer": 1, "exp": "給与の年間収入金額が2,000万円を超える者は年末調整の対象外となり、確定申告が必要となる。"}, {"id": "T025", "category": "タックスプランニング", "type": "mc", "q": "給与所得者が医療費控除を受けるために必要な手続きはどれか。", "choices": ["年末調整のみで適用", "確定申告が必要", "申告不要"], "answer": 1, "exp": "医療費控除は年末調整では適用されず、確定申告を行う必要がある。"}, {"id": "T026", "category": "タックスプランニング", "type": "mc", "q": "青色申告を行うことができる所得の組み合わせとして正しいものはどれか。", "choices": ["利子所得・配当所得・給与所得", "不動産所得・事業所得・山林所得", "一時所得・雑所得・退職所得"], "answer": 1, "exp": "青色申告ができるのは不動産所得・事業所得・山林所得のある者である。"}, {"id": "T027", "category": "タックスプランニング", "type": "mc", "q": "所得税の超過累進税率の説明として正しいものはどれか。", "choices": ["所得が多いほど高い税率を段階的に適用", "所得にかかわらず一律の税率", "所得が多いほど低い税率"], "answer": 0, "exp": "所得税は課税所得を段階に分け、高い部分ほど高い税率を適用する超過累進税率を採用している。"}, {"id": "T028", "category": "タックスプランニング", "type": "mc", "q": "所得税における総所得金額から差し引く所得控除のうち、人的控除に分類されるものはどれか。", "choices": ["基礎控除", "医療費控除", "地震保険料控除"], "answer": 0, "exp": "基礎控除・配偶者控除・扶養控除などは人的控除。医療費控除や地震保険料控除は物的控除に分類される。"}, {"id": "T029", "category": "タックスプランニング", "type": "mc", "q": "住宅借入金等特別控除（住宅ローン控除）は、税額計算上どの段階で控除されるか。", "choices": ["所得控除として課税所得から控除", "税額控除として算出税額から控除", "収入から直接控除"], "answer": 1, "exp": "住宅ローン控除は算出した所得税額から直接差し引く税額控除である。"}, {"id": "T030", "category": "タックスプランニング", "type": "mc", "q": "所得税の確定申告で納め過ぎた税金の還付を受けるための申告を何というか。", "choices": ["期限後申告", "修正申告", "還付申告"], "answer": 2, "exp": "還付を受けるための申告を還付申告といい、対象年の翌年1月1日から5年間提出できる。"}, {"id": "E012", "category": "不動産", "type": "mc", "q": "不動産登記記録の表題部に記録される事項はどれか。", "choices": ["土地の所在・地番・地目・地積", "所有権に関する事項", "抵当権に関する事項"], "answer": 0, "exp": "表題部には不動産の物理的状況（所在・地番・地目・地積など）が記録される。"}, {"id": "E013", "category": "不動産", "type": "mc", "q": "不動産登記には公信力があるか。", "choices": ["公信力がある", "公信力はない", "対抗力がない"], "answer": 1, "exp": "日本の不動産登記に公信力はなく、登記を信じて取引しても保護されない場合がある（対抗力はある）。"}, {"id": "E014", "category": "不動産", "type": "mc", "q": "相続税路線価は、地価公示価格のおおむね何％を目安に設定されているか。", "choices": ["70%", "80%", "90%"], "answer": 1, "exp": "相続税路線価は地価公示価格の約80%を目安に評価される。"}, {"id": "E015", "category": "不動産", "type": "mc", "q": "固定資産税評価額は、地価公示価格のおおむね何％を目安としているか。", "choices": ["70%", "80%", "90%"], "answer": 0, "exp": "固定資産税評価額は地価公示価格の約70%を目安に設定される。"}, {"id": "E016", "category": "不動産", "type": "mc", "q": "宅地建物取引業者が自ら売主となる場合に受け取れる手付金の上限は、売買代金の何割か。", "choices": ["1割", "2割", "3割"], "answer": 1, "exp": "宅建業者が自ら売主となる場合、手付金は売買代金の2割を超えて受領できない。"}, {"id": "E017", "category": "不動産", "type": "mc", "q": "専属専任媒介契約において、依頼者への業務処理状況の報告義務の頻度はどれか。", "choices": ["1週間に1回以上", "2週間に1回以上", "1か月に1回以上"], "answer": 0, "exp": "専属専任媒介契約は1週間に1回以上の報告義務がある（専任媒介は2週間に1回以上）。"}, {"id": "E018", "category": "不動産", "type": "mc", "q": "民法上、売買契約において売主が負う、引き渡した目的物の不適合に対する責任を何というか。", "choices": ["契約不適合責任", "瑕疵担保責任", "債務不履行責任"], "answer": 0, "exp": "2020年施行の改正民法により、従来の瑕疵担保責任は契約不適合責任に改められた。"}, {"id": "E019", "category": "不動産", "type": "mc", "q": "普通借家契約において、貸主が更新を拒絶するために必要なものはどれか。", "choices": ["正当事由", "借主の同意のみ", "理由は不要"], "answer": 0, "exp": "普通借家契約で貸主が更新拒絶や解約を行うには正当事由が必要である。"}, {"id": "E020", "category": "不動産", "type": "mc", "q": "建築基準法において、建築物の敷地は原則として幅員何m以上の道路に何m以上接していなければならないか。", "choices": ["幅員4m以上の道路に2m以上", "幅員6m以上の道路に4m以上", "幅員2m以上の道路に2m以上"], "answer": 0, "exp": "接道義務として、原則幅員4m以上の道路に2m以上接する必要がある。"}, {"id": "E021", "category": "不動産", "type": "mc", "q": "建築基準法上、容積率を求める計算式はどれか。", "choices": ["建築面積 ÷ 敷地面積", "延べ面積 ÷ 敷地面積", "敷地面積 ÷ 延べ面積"], "answer": 1, "exp": "容積率＝延べ面積÷敷地面積。建築面積を用いる建蔽率とは異なる。"}, {"id": "E022", "category": "不動産", "type": "mc", "q": "防火地域内に耐火建築物を建築する場合、建蔽率はどのように扱われるか。", "choices": ["10%緩和される", "変わらない", "20%緩和される"], "answer": 0, "exp": "防火地域内に耐火建築物等を建てる場合、建蔽率は原則10%加算（緩和）される。"}, {"id": "E023", "category": "不動産", "type": "mc", "q": "区分所有法における集会の決議で、規約の変更に必要な賛成の割合はどれか。", "choices": ["過半数", "4分の3以上", "5分の4以上"], "answer": 1, "exp": "規約の設定・変更・廃止は、区分所有者および議決権の各4分の3以上の賛成が必要。"}, {"id": "E024", "category": "不動産", "type": "mc", "q": "土地・建物の譲渡所得が長期譲渡所得となるのは、譲渡した年の1月1日時点で所有期間が何年を超える場合か。", "choices": ["3年", "5年", "10年"], "answer": 1, "exp": "譲渡年の1月1日時点で所有期間が5年を超えると長期譲渡所得となる。"}, {"id": "E025", "category": "不動産", "type": "mc", "q": "居住用財産を譲渡した場合の長期譲渡所得の軽減税率の特例は、所有期間が何年を超える場合に適用されるか。", "choices": ["5年超", "10年超", "20年超"], "answer": 1, "exp": "所有期間10年超の居住用財産の譲渡は、軽減税率の特例の対象となる（3000万円特別控除と併用可）。"}, {"id": "E026", "category": "不動産", "type": "mc", "q": "不動産の保有期間中、毎年1月1日現在の所有者に対して市町村が課税する税金はどれか。", "choices": ["不動産取得税", "固定資産税", "登録免許税"], "answer": 1, "exp": "固定資産税は毎年1月1日時点の所有者に対して市町村が課税する地方税である。"}, {"id": "E027", "category": "不動産", "type": "mc", "q": "土地・建物の売買契約書に課される税金はどれか。", "choices": ["印紙税", "登録免許税", "不動産取得税"], "answer": 0, "exp": "契約書などの文書には印紙税が課される。"}, {"id": "E028", "category": "不動産", "type": "mc", "q": "登記の申請に対して課される国税はどれか。", "choices": ["固定資産税", "登録免許税", "都市計画税"], "answer": 1, "exp": "不動産の登記を行う際には登録免許税（国税）が課される。"}, {"id": "E029", "category": "不動産", "type": "mc", "q": "投資用不動産の収益性を測る指標で、年間賃料収入を物件価格で割ったものを何というか。", "choices": ["表面利回り", "NOI利回り", "内部収益率"], "answer": 0, "exp": "表面利回り（グロス利回り）＝年間賃料収入÷物件価格×100。諸経費を考慮しない単純な利回り。"}, {"id": "E030", "category": "不動産", "type": "mc", "q": "市街化調整区域の説明として正しいものはどれか。", "choices": ["市街化を抑制すべき区域", "おおむね10年以内に市街化を図る区域", "用途を定めない区域"], "answer": 0, "exp": "市街化調整区域は市街化を抑制すべき区域で、原則として開発が制限される。"}, {"id": "S012", "category": "相続・事業承継", "type": "mc", "q": "被相続人に配偶者と直系尊属（父母）がいる場合、配偶者の法定相続分はいくらか。", "choices": ["2分の1", "3分の2", "4分の3"], "answer": 1, "exp": "配偶者と直系尊属が相続人の場合、配偶者の法定相続分は3分の2、直系尊属は3分の1。"}, {"id": "S013", "category": "相続・事業承継", "type": "mc", "q": "被相続人に配偶者と兄弟姉妹がいる場合、配偶者の法定相続分はいくらか。", "choices": ["2分の1", "3分の2", "4分の3"], "answer": 2, "exp": "配偶者と兄弟姉妹が相続人の場合、配偶者の法定相続分は4分の3、兄弟姉妹は4分の1。"}, {"id": "S014", "category": "相続・事業承継", "type": "mc", "q": "公正証書遺言を作成する際に必要な証人の人数は何人以上か。", "choices": ["1人", "2人", "3人"], "answer": 1, "exp": "公正証書遺言の作成には証人2人以上の立会いが必要である。"}, {"id": "S015", "category": "相続・事業承継", "type": "mc", "q": "公正証書遺言について、家庭裁判所の検認は必要か。", "choices": ["必要", "不要", "場合による"], "answer": 1, "exp": "公正証書遺言は検認が不要。自筆証書遺言（法務局保管を除く）は検認が必要。"}, {"id": "S016", "category": "相続・事業承継", "type": "mc", "q": "配偶者と子2人が相続人で、遺産の総額に対する遺留分の総額の割合はいくらか。", "choices": ["2分の1", "3分の1", "4分の1"], "answer": 0, "exp": "直系尊属のみが相続人の場合を除き、遺留分の総体的割合は遺産の2分の1である。"}, {"id": "S017", "category": "相続・事業承継", "type": "mc", "q": "限定承認を行う場合、相続人が複数いるときはどのように行う必要があるか。", "choices": ["各相続人が単独で可能", "共同相続人全員で行う", "代表者1人で可能"], "answer": 1, "exp": "限定承認は共同相続人全員が共同して家庭裁判所に申述する必要がある。"}, {"id": "S018", "category": "相続・事業承継", "type": "mc", "q": "相続税の申告書の提出期限は、相続の開始があったことを知った日の翌日から原則何か月以内か。", "choices": ["3か月以内", "6か月以内", "10か月以内"], "answer": 2, "exp": "相続税の申告・納付期限は、相続開始を知った日の翌日から10か月以内である。"}, {"id": "S019", "category": "相続・事業承継", "type": "mc", "q": "被相続人の配偶者が相続により取得した財産について適用される「配偶者の税額軽減」では、原則として法定相続分相当額または何円までは相続税がかからないか。", "choices": ["1億円", "1億6,000万円", "2億円"], "answer": 1, "exp": "配偶者の税額軽減により、配偶者が取得した財産は法定相続分相当額または1億6,000万円のいずれか多い金額まで非課税となる。"}, {"id": "S020", "category": "相続・事業承継", "type": "mc", "q": "死亡退職金の相続税における非課税限度額の計算式はどれか。", "choices": ["500万円 × 法定相続人の数", "600万円 × 法定相続人の数", "1,000万円 × 法定相続人の数"], "answer": 0, "exp": "死亡退職金の非課税限度額は、死亡保険金と同様に500万円×法定相続人の数である。"}, {"id": "S021", "category": "相続・事業承継", "type": "mc", "q": "相続税の基礎控除額の計算における「法定相続人の数」に算入できる普通養子は、実子がいる場合何人までか。", "choices": ["1人まで", "2人まで", "制限なし"], "answer": 0, "exp": "実子がいる場合、基礎控除等の計算に算入できる養子は1人まで（実子がいない場合は2人まで）。"}, {"id": "S022", "category": "相続・事業承継", "type": "mc", "q": "2024年（令和6年）以降、暦年課税による生前贈与の相続財産への加算期間は、相続開始前何年以内に延長されたか。", "choices": ["3年以内", "5年以内", "7年以内"], "answer": 2, "exp": "2024年改正により、生前贈与加算の対象期間が相続開始前3年以内から7年以内へ段階的に延長された。"}, {"id": "S023", "category": "相続・事業承継", "type": "mc", "q": "2024年（令和6年）以降の相続時精算課税制度において、特別控除2,500万円とは別に新設された年間の基礎控除額はいくらか。", "choices": ["60万円", "110万円", "2,500万円"], "answer": 1, "exp": "2024年から相続時精算課税制度に年間110万円の基礎控除が新設され、この範囲内の贈与は相続財産に加算されない。"}, {"id": "S024", "category": "相続・事業承継", "type": "mc", "q": "贈与税の配偶者控除（おしどり贈与）で、基礎控除とは別に控除できる金額はいくらか。", "choices": ["1,000万円", "2,000万円", "2,500万円"], "answer": 1, "exp": "婚姻期間20年以上の配偶者間の居住用不動産等の贈与では、基礎控除110万円とは別に最高2,000万円が控除できる。"}, {"id": "S025", "category": "相続・事業承継", "type": "mc", "q": "直系尊属から18歳以上の子や孫への贈与に適用される贈与税の税率区分を何というか。", "choices": ["特例贈与財産（特例税率）", "一般贈与財産（一般税率）", "非課税財産"], "answer": 0, "exp": "直系尊属から18歳以上の者への贈与は特例贈与財産として一般より低い特例税率が適用される。"}, {"id": "S026", "category": "相続・事業承継", "type": "mc", "q": "小規模宅地等の特例において、被相続人の居住用宅地（特定居住用宅地等）は何㎡まで評価額が80%減額されるか。", "choices": ["200㎡", "330㎡", "400㎡"], "answer": 1, "exp": "特定居住用宅地等は330㎡まで評価額が80%減額される。"}, {"id": "S027", "category": "相続・事業承継", "type": "mc", "q": "小規模宅地等の特例において、事業用宅地（特定事業用宅地等）の限度面積と減額割合の組み合わせはどれか。", "choices": ["400㎡・80%減額", "330㎡・80%減額", "200㎡・50%減額"], "answer": 0, "exp": "特定事業用宅地等は400㎡まで80%減額の対象となる。"}, {"id": "S028", "category": "相続・事業承継", "type": "mc", "q": "上場株式を相続した場合の相続税評価額は、原則として複数の価額のうちどれを用いるか。", "choices": ["最も高い価額", "最も低い価額", "課税時期の終値など4つのうち最も低い価額"], "answer": 2, "exp": "上場株式は、課税時期の終値、当月・前月・前々月の各月平均額のうち最も低い価額で評価する。"}, {"id": "S029", "category": "相続・事業承継", "type": "mc", "q": "取引相場のない株式について、同族株主以外の少数株主が取得する場合に用いられる評価方式はどれか。", "choices": ["配当還元方式", "類似業種比準方式", "純資産価額方式"], "answer": 0, "exp": "同族株主以外の少数株主が取得する株式は、配当還元方式という特例的評価方式で評価する。"}, {"id": "S030", "category": "相続・事業承継", "type": "mc", "q": "相続を放棄した者は、相続税の計算上「法定相続人の数」に含めるか。", "choices": ["含めない", "放棄がなかったものとして含める", "半分だけ含める"], "answer": 1, "exp": "相続税の基礎控除等の計算では、相続放棄があってもなかったものとして法定相続人の数に含める。"}];
const CATS = ["ライフプランニング","リスク管理","金融資産運用","タックスプランニング","不動産","相続・事業承継"];
const CAT_SHORT = {"ライフプランニング":"ライフ","リスク管理":"リスク","金融資産運用":"金融資産","タックスプランニング":"タックス","不動産":"不動産","相続・事業承継":"相続"};

// ---- persistence (in-memory, session only) ----
let progress = {}; // id -> {answered:true, correct:bool}
function catStats(cat){
  const qs = DATA.filter(q=>q.category===cat);
  let done=0, correct=0;
  qs.forEach(q=>{ if(progress[q.id]){done++; if(progress[q.id].correct)correct++;} });
  return {total:qs.length, done, correct};
}
function overall(){
  let done=0,correct=0;
  DATA.forEach(q=>{ if(progress[q.id]){done++; if(progress[q.id].correct)correct++;}});
  return {total:DATA.length, done, correct};
}

const app = document.getElementById('app');
const hdr = document.getElementById('hdr');
const hdrTitle = document.getElementById('hdrTitle');
const backBtn = document.getElementById('backBtn');
const ftr = document.getElementById('ftr');
let navStack = [];

function setHeader(show, title){
  if(show){ hdr.classList.remove('hidden'); hdrTitle.textContent=title; }
  else hdr.classList.add('hidden');
}
backBtn.onclick = ()=>{ if(navStack.length){ const f=navStack.pop(); f(); } else renderHome(); };

// ---------- HOME ----------
function renderHome(){
  navStack=[];
  setHeader(false);
  ftr.classList.remove('hidden');
  const o = overall();
  const pct = o.done? Math.round(o.correct/o.done*100):0;
  let html = `
  <div class="brand">
    <div class="eyebrow">FP technician 3rd</div>
    <h1>FP3級 学習</h1>
    <p>障害者相談支援の現場で活きる<br>ファイナンシャル・プランニング</p>
  </div>
  <div class="statbar">
    <div class="statbox"><div class="n">${o.done}<span style="font-size:14px;color:var(--muted)">/${o.total}</span></div><div class="l">解答済み</div></div>
    <div class="statbox"><div class="n">${pct}<span style="font-size:14px;color:var(--muted)">%</span></div><div class="l">正答率</div></div>
  </div>
  <button class="btn gold" id="examBtn">模擬試験 30問にチャレンジ</button>
  <div class="seclabel">分野別に学ぶ</div>`;
  CATS.forEach((c,i)=>{
    const s = catStats(c);
    const p = s.total? Math.round(s.done/s.total*100):0;
    html += `
    <div class="cat" data-cat="${c}">
      <div class="idx">${i+1}</div>
      <div class="body">
        <div class="nm">${c}</div>
        <div class="meta">全${s.total}問 &middot; ${s.done}問完了 &middot; 正答${s.correct}</div>
        <div class="bar"><i style="width:${p}%"></i></div>
      </div>
      <div class="pct">${p}%</div>
    </div>`;
  });
  html += `<div class="hint">スコアはこのセッション中のみ記録されます。アプリを完全に閉じるとリセットされます。</div>`;
  app.innerHTML = html;
  document.getElementById('examBtn').onclick = ()=>startQuiz(buildExam(), "模擬試験", true);
  document.querySelectorAll('.cat').forEach(el=>{
    el.onclick = ()=> renderCatMenu(el.dataset.cat);
  });
  window.scrollTo(0,0);
}

// ---------- CATEGORY MENU ----------
function renderCatMenu(cat){
  navStack=[renderHome];
  setHeader(true, CAT_SHORT[cat]||cat);
  ftr.classList.add('hidden');
  const qs = DATA.filter(q=>q.category===cat);
  const s = catStats(cat);
  const wrongIds = qs.filter(q=>progress[q.id] && !progress[q.id].correct).map(q=>q.id);
  let html = `
  <div class="brand" style="padding:14px 4px 4px">
    <div class="eyebrow">分野 ${CATS.indexOf(cat)+1}</div>
    <h1 style="font-size:22px">${cat}</h1>
    <p>全${s.total}問 &middot; 完了${s.done} &middot; 正答率${s.done?Math.round(s.correct/s.done*100):0}%</p>
  </div>
  <button class="btn primary" id="allBtn">この分野を全問演習（${s.total}問）</button>`;
  if(wrongIds.length){
    html += `<button class="btn ghost" id="wrongBtn">間違えた問題を復習（${wrongIds.length}問）</button>`;
  }
  app.innerHTML = html;
  document.getElementById('allBtn').onclick = ()=>{
    navStack=[renderHome, ()=>renderCatMenu(cat)];
    startQuiz(shuffle(qs.slice()), cat, false);
  };
  if(wrongIds.length){
    document.getElementById('wrongBtn').onclick = ()=>{
      navStack=[renderHome, ()=>renderCatMenu(cat)];
      startQuiz(qs.filter(q=>wrongIds.includes(q.id)), cat+"（復習）", false);
    };
  }
  window.scrollTo(0,0);
}

// ---------- QUIZ ENGINE ----------
let quiz = null;
function startQuiz(questions, label, isExam){
  if(!questions.length){ renderHome(); return; }
  quiz = { qs:questions, i:0, correct:0, label, isExam, wrong:[] };
  setHeader(true, label);
  ftr.classList.add('hidden');
  renderQuestion();
}
function renderQuestion(){
  const q = quiz.qs[quiz.i];
  const prog = Math.round((quiz.i)/quiz.qs.length*100);
  const isOX = q.type==='ox';
  let choicesHtml = q.choices.map((c,idx)=>{
    const letter = String.fromCharCode(65+idx);
    return `<button class="choice ${isOX?'ox':''}" data-i="${idx}">
      <span class="mk">${letter}</span><span>${c}</span></button>`;
  }).join('');
  app.innerHTML = `
    <div class="qmeta">
      <span class="qcat">${CAT_SHORT[q.category]||q.category}</span>
      <span>${quiz.i+1} / ${quiz.qs.length}</span>
    </div>
    <div class="progline"><i style="width:${prog}%"></i></div>
    <div class="qcard">
      <span class="qtype">${isOX?'○ × 問題':'選択問題'}</span>
      <div class="qtext">${q.q}</div>
    </div>
    <div class="choices" id="choices">${choicesHtml}</div>
    <div id="afterbox"></div>`;
  document.querySelectorAll('.choice').forEach(el=>{
    el.onclick = ()=> answer(parseInt(el.dataset.i), el);
  });
  window.scrollTo(0,0);
}
function answer(idx, el){
  const q = quiz.qs[quiz.i];
  if(quiz.answered) return;
  quiz.answered = true;
  const correct = idx===q.answer;
  if(correct) quiz.correct++; else quiz.wrong.push(q);
  progress[q.id] = {answered:true, correct};
  // mark choices
  const nodes = document.querySelectorAll('.choice');
  nodes.forEach((n,i)=>{
    n.style.pointerEvents='none';
    if(i===q.answer) n.classList.add('correct');
    else if(i===idx) n.classList.add('wrong');
  });
  const ab = document.getElementById('afterbox');
  ab.innerHTML = `
    <div class="explain">
      <div class="verdict ${correct?'ok':'ng'}">${correct?'正解':'不正解'}</div>
      <div>${q.exp}</div>
    </div>
    <div class="foot">
      <button class="btn primary" id="nextBtn">${quiz.i+1<quiz.qs.length?'次の問題 ›':'結果を見る'}</button>
    </div>`;
  document.getElementById('nextBtn').onclick = next;
  document.getElementById('afterbox').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){
  quiz.answered=false;
  quiz.i++;
  if(quiz.i>=quiz.qs.length) renderResult();
  else renderQuestion();
}
// ---------- RESULT ----------
function renderResult(){
  const total = quiz.qs.length;
  const pct = Math.round(quiz.correct/total*100);
  let verdict, vcolor;
  if(quiz.isExam){
    // FP3 学科は60%が合格目安
    if(pct>=60){verdict='合格ライン到達（60%以上）';vcolor='var(--ok)';}
    else {verdict='あと一歩 — 合格目安は60%';vcolor='var(--red)';}
  } else {
    if(pct>=80){verdict='よく仕上がっています';vcolor='var(--ok)';}
    else if(pct>=60){verdict='合格圏 — 復習で確実に';vcolor='var(--gold)';}
    else {verdict='復習が必要です';vcolor='var(--red)';}
  }
  setHeader(true, '結果');
  let html = `
    <div class="qcard">
      <div class="scorebig">
        <div class="ring">${pct}<span style="font-size:24px">%</span></div>
        <div class="lbl">${total}問中 ${quiz.correct}問 正解</div>
        <div class="verdict" style="color:${vcolor}">${verdict}</div>
      </div>
    </div>`;
  if(quiz.wrong.length){
    html += `<div class="seclabel">間違えた問題（${quiz.wrong.length}）</div><div class="reviewlist">`;
    quiz.wrong.forEach(q=>{
      html += `<div class="rvitem">
        <div class="q">${q.q}</div>
        <div class="a">正解: ${q.choices[q.answer]}</div>
        <div class="e">${q.exp}</div>
      </div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="hint" style="font-size:14px;color:var(--ok);font-weight:700">全問正解。完璧です。</div>`;
  }
  html += `<button class="btn primary" id="homeBtn" style="margin-top:8px">ホームに戻る</button>`;
  app.innerHTML = html;
  document.getElementById('homeBtn').onclick = renderHome;
  window.scrollTo(0,0);
}
// ---------- EXAM BUILDER ----------
function buildExam(){
  // 各分野から均等に近い配分で30問抽出
  const per = [5,5,5,5,5,5]; // 合計30, 出題比率を意識
  let picked=[];
  CATS.forEach((c,i)=>{
    const pool = shuffle(DATA.filter(q=>q.category===c).slice());
    picked = picked.concat(pool.slice(0, per[i]));
  });
  return shuffle(picked);
}
// ---------- utils ----------
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

renderHome();
</script>
</body>
</html>
